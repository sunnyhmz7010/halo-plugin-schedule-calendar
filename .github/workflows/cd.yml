name: CD

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
    with:
      app-id: ${{ vars.HALO_APP_ID }}
      ui-path: ui
      pnpm-version: "9.15.9"
      skip-appstore-release: false
