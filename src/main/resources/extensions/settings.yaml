apiVersion: v1alpha1
kind: Setting
metadata:
  name: schedule-calendar-settings
spec:
  forms:
    - group: public_page
      label: 基本设置
      formSchema:
        - $formkit: text
          name: title
          label: 前台页面标题
          value: 日程日历
          help: 用于前台 /schedule-calendar 路由页面的标题和页头文案；若主题已适配 schedule-calendar.html 模板，主题模板将优先于插件自带页面
